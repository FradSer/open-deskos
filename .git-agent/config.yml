scopes:
    - name: shell
      description: Desktop environment, renderer, app lifecycle, and plugins in runtime/linux/; does not cover integration-level services.
    - name: hw
      description: ESP32 firmware drivers and peripheral control logic in peripherals/; does not cover Linux-side host processes.
    - name: link
      description: Connectivity bridges, transport protocols, and agent-service communications in integrations/; does not cover desktop shell UI.
    - name: vision
      description: Face agent, computer vision pipelines, and normalization logic in experiments/vision/; does not cover general UI.
    - name: p4
      description: Hardware research, firmware simulation, and architectural specs in research/esp32-p4-c6-deskos/firmware/; does not cover production drivers.
    - name: mac
      description: Apple companion agent, macOS management console, and CLI tools in research/esp32-p4-c6-deskos/apple/.
    - name: tool
      description: Build automation, codegen scripts, and repository infrastructure in tools/; does not cover core application logic.
    - name: exp
      description: Experimental prototypes and proof-of-concept projects in experiments/; does not cover core product runtime or peripherals.
