scopes:
    - name: shell
      description: Display Shell runtime on every Shell Host, including renderer, deployment, and tests in runtime/linux/; named for the Shell, not a host device, and does not cover integration tools.
    - name: hw
      description: Peripheral hardware implementations and ESP32 drivers in peripherals/; does not cover Linux runtime.
    - name: link
      description: Bridge and communication protocols in integrations/; handles multi-transport arbitration and system connectivity.
    - name: vision
      description: Opt-in face agent and vision pipelines in experiments/vision/; does not cover shell UI components.
    - name: p4
      description: Firmware research, simulator, and specifications in research/esp32-p4-c6-deskos/firmware/; does not cover production hardware.
    - name: mac
      description: Apple-specific companion agent and management console in research/esp32-p4-c6-deskos/apple/.
    - name: tool
      description: Utility scripts, codegen tools, and build infrastructure in tools/; does not cover core application logic.
