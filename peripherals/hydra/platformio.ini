; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = main-node

[env:sub-node]
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/archive/e7c1e8cd47bcaf02da3a00d81b886d057d93c7d9.zip
platform = https://github.com/pioarduino/platform-espressif32/archive/dc84ada571d08cbecfd74e026fa2d83f31bb5945.zip
board = M5NanoC6
framework = arduino
monitor_speed = 115200
; Dual OTA table (ota_0 + ota_1) so esp_ota_* wireless flashing works. Custom table
; with larger app slots than default.csv (1.5MB each) to fit the main-node image.
board_build.partitions = partitions/hydra_ota.csv
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<domain/> +<shared/> +<sub_node/>
lib_deps = 
	https://github.com/m5stack/M5NanoC6#7cf509694316c9acb41e98658fb0ddb8ab6db790
	adafruit/Adafruit NeoPixel@1.15.5

[env:main-node]
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/archive/e7c1e8cd47bcaf02da3a00d81b886d057d93c7d9.zip
build_flags = -DHYDRA_DESKTOP_TELEMETRY=1
platform = https://github.com/pioarduino/platform-espressif32/archive/dc84ada571d08cbecfd74e026fa2d83f31bb5945.zip
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Dual OTA table so esp_ota_* wireless flashing works (4MB M5StickC Plus flash).
board_build.partitions = partitions/hydra_ota.csv
build_src_filter = -<*> +<domain/> +<shared/> +<main_node/>
lib_deps = 
	m5stack/M5Unified@0.2.17
	m5stack/M5Unit-ENV@1.5.0
	knolleary/PubSubClient@2.8.0
	tzapu/WiFiManager@2.0.17

[env:main-node-private]
extends = env:main-node
extra_scripts = pre:tools/private_build_guard.py
build_flags = ${env:main-node.build_flags} -DHYDRA_ENABLE_PRIVATE_PROVISION=1

[env:grove-test]
platform = https://github.com/pioarduino/platform-espressif32/archive/dc84ada571d08cbecfd74e026fa2d83f31bb5945.zip
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = no_ota.csv
build_src_filter = -<*> +<bringup/>
lib_deps = 
	m5stack/M5Unified@0.2.17

[env:native]
platform = native
test_framework = unity
; Host tests exercise only header-only domain/app logic (included directly); no
; Arduino-dependent src/*.cpp may compile here, so the filter excludes them all.
build_src_filter = -<*>
build_flags = -std=c++17 -Itest/sdk_stubs
