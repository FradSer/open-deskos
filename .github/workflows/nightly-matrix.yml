name: Nightly full rendering matrix

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: runtime/shell/pnpm-lock.yaml
      - name: Install Shell dependencies
        working-directory: runtime/shell
        run: pnpm install --frozen-lockfile
      - name: Build generated renderer assets
        working-directory: runtime/shell
        run: pnpm styles
      - name: Configure the Electron SUID sandbox helper
        working-directory: runtime/shell
        run: |
          installer="$(ls node_modules/.pnpm/electron@*/node_modules/electron/install.js | head -1)"
          test -n "$installer"
          node "$installer"
          helper=""
          for candidate in node_modules/.pnpm/electron@*/node_modules/electron/dist/chrome-sandbox; do
            if [ -e "$candidate" ]; then helper="$(readlink -f "$candidate")"; break; fi
          done
          echo "sandbox helper: ${helper:-<not found>}"
          ls -l "$helper"
          test -n "$helper"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Run the full rendering matrix
        working-directory: runtime/shell
        run: xvfb-run -a --server-args="-screen 0 1920x1280x24" pnpm test:matrix
