# For PRs, please do not modify this file.

.build_template:
  stage: build
  tags:
    - build
  image: ${IMAGE}
  variables:
    # Enable ccache for all build jobs. See configure_ci_environment.sh for more ccache related settings.
    IDF_CCACHE_ENABLE: "1"
    BATCH_BUILD: "1"
    V: "0"
    WARNING_STR: ""

.build_examples_template:
  extends:
    - .build_template
  artifacts:
    when: always
    paths:
      - "**/build*/size.json"
      - "**/build*/build_log.txt"
      - "**/build*/*.bin"
      - "**/build*/*.map"
      - "**/build*/*.elf"
      - "**/build*/flasher_args.json"
      - "**/build*/flash_args"
      - "**/build*/flash_project_args"
      - "**/build*/config/sdkconfig.json"
      - "**/build*/bootloader/*.bin"
      - "**/build*/bootloader/*.elf"
      - "**/build*/partition_table/*.bin"
      - "**/build*/mmap_build/**/*.bin"
      - "**/build*/**/*.bin"
      - "firmware_output/*.tar.gz"
      - "firmware_output/*.json"
      - size_info.txt
    expire_in: 1 week
  variables:
    IDF_CI_BUILD: "1"
    EXAMPLE_CONFIG: "="
    EXAMPLE_TARGET: ""
    EXAMPLE_APPEND_ARGS: ""
    EXAMPLE_BOARD: "default"
    EXAMPLE_BOARD_PATH: "boards"
    BUILD_RECURSIVE: "1"
  script:
    - pip install idf_build_apps esp-bmgr-assist
    - |
      if [ -n "${EXAMPLE_BOARD_BRAND}" ]; then
        export EXAMPLE_BOARD_PATH="boards/${EXAMPLE_BOARD_BRAND}"
      fi
    - |
      python .gitlab/ci/build_apps.py ${EXAMPLE_DIR} \
              --config ${EXAMPLE_CONFIG} \
              -t ${EXAMPLE_TARGET} \
              -r ${BUILD_RECURSIVE} \
              -vv \
              --board ${EXAMPLE_BOARD} \
              --board-path ${EXAMPLE_BOARD_PATH} \
              --ignore-warnings \
              ${EXAMPLE_APPEND_ARGS}
    - python .gitlab/ci/package_firmware.py

.build_idf_active_release_version:
  parallel:
    matrix:
      - IMAGE: espressif/idf:release-v5.5

build_application_open_deskos:
  extends:
    - .build_examples_template
    - .rules:build:application_open_deskos
  variables:
    IMAGE: espressif/idf:release-v5.5
    EXAMPLE_DIR: application/open_deskos
    EXAMPLE_BOARD: jc4880p443c
    EXAMPLE_TARGET: esp32p4
    EXAMPLE_BOARD_BRAND: guition
