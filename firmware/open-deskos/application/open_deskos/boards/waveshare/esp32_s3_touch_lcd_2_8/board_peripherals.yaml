# Waveshare ESP32-S3 Touch LCD 2.8 hardware map.
# Pin assignments mirror xiaozhi-esp32-2.2.6 and the existing pulse-esp IDF
# driver: ST7789 over SPI2, CST328 over I2C1, backlight on GPIO5.
peripherals:
  - name: i2c_touch
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 1
        scl: 3

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        mosi_io_num: 45
        sclk_io_num: 40
        max_transfer_sz: 19200

  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 5
      freq_hz: 20000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: false
