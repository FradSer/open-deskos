## IDF Component Manager Manifest File
dependencies:
  espressif/esp_board_manager:
    version: ^0.6
    public: true

  app_claw:
    path: ../../../components/common/app_claw

  app_config:
    path: ../components/app_config

  captive_dns:
    path: ../../../components/common/captive_dns

  espressif/ramfs:
    version: ^0.1

  claw_utils:
    path: ../../../components/claw_modules/claw_utils

  # emote (facial-animation assets) pulls esp_emote_expression ->
  # esp_emote_assets, whose 0.1.2 build now exceeds the 1M `emote` partition in
  # partitions_open-deskos_16MB.csv. The launcher (Open DeskOS shell) does not use
  # emote, and the display is driven directly by odk_display_bringup, so gate
  # it on APP_CLAW_ENABLE_EMOTE (default off) instead of the board's display
  # symbol — which setup_device.c also needs for its device headers.
  emote:
    path: ../../../components/common/emote
    rules:
    - if: $CONFIG{APP_CLAW_ENABLE_EMOTE} == True

  http_reuse:
    path: ../../../components/common/http_reuse

  http_server:
    path: ../components/http_server

  settings:
    path: ../../../components/common/settings

  wifi_manager:
    path: ../../../components/common/wifi_manager

  esp_video:
    path: ../../../components/common/esp_video
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True

  # Open DeskOS App platform. These local components have no idf_component.yml of
  # their own, so each is listed here for the component manager; the
  # composition root wires them together.
  odk_domain:
    path: ../../../components/odk_domain
  odk_espnow_validator:
    path: ../../../components/odk_espnow_validator
  odk_sandbox:
    path: ../../../components/odk_sandbox
  # odk_sandbox's Lua VM. cap_lua (which also pulls georgik/lua) is not in the
  # headless build, so declare it here to guarantee the component manager
  # downloads/registers georgik__lua for odk_sandbox's REQUIRES.
  georgik/lua: ^5.5.0~7
  cap_lua:
    path: ../../../components/claw_capabilities/cap_lua
  odk_svc_llm:
    path: ../../../components/odk_svc_llm
  odk_installer:
    path: ../../../components/odk_installer
  odk_app_manager:
    path: ../../../components/odk_app_manager
  odk_app_runtime:
    path: ../../../components/odk_app_runtime
  odk_gen:
    path: ../../../components/odk_gen
  odk_console:
    path: ../../../components/odk_console
  odk_sub:
    path: ../../../components/odk_sub
  display_arbiter:
    path: ../../../components/common/display_arbiter
  lua_module_lvgl:
    path: ../../../components/lua_modules/lua_module_lvgl

  # LVGL tear-free path for Guition MIPI-DSI (TRIPLE_FULL / DOUBLE_DIRECT).
  espressif/esp_lvgl_adapter: ^0.6.2
  espressif/esp_hosted: '*'
