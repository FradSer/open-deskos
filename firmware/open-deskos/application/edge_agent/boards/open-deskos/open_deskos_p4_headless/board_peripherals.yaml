version: 1.0.0
# Peripherals for the Open DeskOS P4 headless board.
# Pin numbers are the single source of truth from firmware/main/lumina_p4_pins.h.
# No display / DSI / backlight peripheral is declared by design: the CO6300 DSI
# panel is an unresolved hardware hard-gate (HG-1) owned by a separate swimlane.
# This mirrors espressif/esp32_p4_function_ev's non-display peripherals
# (i2c_master, i2s_audio_out, i2s_audio_in, gpio_pa_control), adapted to the
# real LUMINA-P4 module pins instead of the EV board's dev-kit pins.
peripherals:
  # I2C0 — audio ICs (CS43131 DAC, TAS5825M amp, AK5572 ADC).
  # lumina_p4_pins.h: LP4_I2C0_SDA=8, LP4_I2C0_SCL=9.
  - name: i2c_port0
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 8
        scl: 9

  # I2C1 — power management / control (BQ25703A, BQ40Z50, STUSB4500, ZT2628,
  # HYM8563, TCA9555). lumina_p4_pins.h: LP4_I2C1_SDA=6, LP4_I2C1_SCL=7.
  - name: i2c_port1
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 6
        scl: 7

  # I2S0 — CS43131 DAC playback path (has MCLK). Output-only bus, so din is
  # unused. lumina_p4_pins.h: LP4_I2S0_MCLK=20, LP4_I2S0_BCLK=21,
  # LP4_I2S0_LRCK=22, LP4_I2S0_DOUT=23.
  - name: i2s_audio_out
    type: i2s
    role: master
    format: "std-out"
    config:
      port: 0
      sample_rate_hz: 48000
      clk_src: "I2S_CLK_SRC_DEFAULT"
      mclk_multiple: 256
      data_bit_width: 16
      slot_mode: "I2S_SLOT_MODE_STEREO"
      slot_mask: "I2S_STD_SLOT_BOTH"
      ws_width: 16
      pins:
        mclk: 20
        bclk: 21
        ws: 22
        dout: 23
        din: -1

  # I2S2 — AK5572 ADC capture path (has MCLK). Input-only bus, so dout is
  # unused. lumina_p4_pins.h: LP4_I2S2_MCLK=29, LP4_I2S2_BCLK=30,
  # LP4_I2S2_LRCK=31, LP4_I2S2_SDIN=32.
  - name: i2s_audio_in
    type: i2s
    role: master
    format: "std-in"
    config:
      port: 2
      sample_rate_hz: 48000
      clk_src: "I2S_CLK_SRC_DEFAULT"
      mclk_multiple: 256
      data_bit_width: 16
      slot_mode: "I2S_SLOT_MODE_STEREO"
      slot_mask: "I2S_STD_SLOT_BOTH"
      ws_width: 16
      pins:
        mclk: 29
        bclk: 30
        ws: 31
        dout: -1
        din: 32

  # TAS5825M power amplifier power-down/enable control (equivalent role to
  # the EV board's gpio_pa_control). lumina_p4_pins.h: LP4_TAS5825M_PDN=47.
  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 47
      mode: GPIO_MODE_OUTPUT
      pull_up: true
      default_level: 0
