<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'" />
  <title>Open DeskOS</title>
  <link rel="stylesheet" href="uno.css" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <!-- Shell skeleton only. Everything visible is mounted by core/composer.js
       and core plugin hosts from src/renderer/plugins/*.js registrations:
       pages/tiles via config/desktop_layout.js, status-bar and peek via
       kind="status"/"peek" plugins. Widgets state truth first and may continue
       into an App through the platform seam; #app-view is the unified App frame. -->
  <header id="status-bar" class="flex items-center">
    <span data-slot="status-left"></span>
    <div id="page-center" class="flex items-center">
      <span id="page-context" class="sr-only" aria-live="polite" aria-atomic="true">Today · 1/3</span>
      <nav id="dots" class="flex items-center" aria-label="Page indicator"></nav>
    </div>
    <span data-slot="status-right"></span>
    <span id="status-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
  </header>

  <main id="pages-viewport">
    <div id="pages-track"></div>
  </main>

  <button id="peek" class="flex items-center" type="button" aria-label="OpenCode Go, network, and Remote status">
    <span data-slot="peek"></span>
  </button>

  <section id="privacy-shield" role="alert" aria-live="assertive" aria-label="Experimental owner lock" hidden>
    <div class="privacy-shield-content">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
      <p>Experimental owner lock</p>
      <span>Not enabled in the desk shell</span>
    </div>
  </section>

  <div id="system-overlay-root" class="system-overlay-container" aria-live="polite"></div>

  <div id="app-view" role="dialog" aria-modal="true" aria-labelledby="app-title" hidden>
    <header class="app-header flex items-center">
      <button id="app-back" aria-label="Back">
        <svg data-tabler="chevron-left" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 6l-6 6l6 6" /></svg>
      </button>
      <h1 id="app-title"></h1>
    </header>
    <div class="app-body flex flex-col items-center justify-center">
      <div id="app-runtime" class="app-runtime" data-slot="app-runtime"></div>
      <p class="app-empty" id="app-empty"></p>
      <p class="app-help" id="app-help" hidden>Swipe to change pages; select a page dot to jump directly; use Arrow keys or Home/End to navigate; use Back or Escape to return; select the peek to view connection status.</p>
      <p class="app-empty-sub" id="app-empty-sub"></p>
      <button class="button-pill app-action" id="app-action" type="button" hidden>Check status again</button>
      <p class="app-action-status" id="app-action-status" aria-live="polite" hidden></p>
    </div>
  </div>

  <script src="layout.js"></script>
  <script src="core/overlay-alerts.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/services.js"></script>
  <script src="core/composer.js"></script>
  <script src="core/app-platform.js"></script>
  <script src="plugins/dashboard-page.js"></script>
  <script src="plugins/almanac.js"></script>
  <script src="plugins/clock.js"></script>
  <script src="plugins/chat.js"></script>
  <script src="plugins/pomodoro.js"></script>
  <script src="plugins/settings.js"></script>
  <script src="plugins/year.js"></script>
  <script src="plugins/face-presence.js"></script>
  <script src="plugins/current-emotion.js"></script>
  <script src="plugins/quota-page.js"></script>
  <script src="plugins/status-connection.js"></script>
  <script src="plugins/status-clock.js"></script>
  <script src="plugins/status-pi-sessions.js"></script>
  <script src="plugins/peek-bridge.js"></script>
  <script src="plugins/apps.js"></script>
  <script src="plugins/pi-sessions.js"></script>
  <script src="config/desktop_layout.js"></script>
  <script src="shell.js"></script>
</body>
</html>
