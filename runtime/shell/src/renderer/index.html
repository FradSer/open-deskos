<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' odk-native-plugin:; style-src 'self' odk-native-plugin:; font-src 'self' odk-native-plugin:; img-src 'self' odk-native-plugin: data:; connect-src odk-native-plugin:; frame-src odk-user-app:" />
  <title>Open DeskOS</title>
  <link rel="stylesheet" href="uno.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="personal-agent-status.css" />
  <link rel="stylesheet" href="user-app-desktop.css" />
  <link rel="stylesheet" href="themes/border-beam.css" />
  <link rel="stylesheet" href="themes/pixel.css" />
  <link rel="stylesheet" href="home-desk.css" />
  <link rel="stylesheet" href="card-frame.css" />
  <script src="../plugin-host.js"></script>
  <script src="core/appearance-plugins.js"></script>
  <script src="core/development-plugins.js"></script>
  <script src="core/native-appearance.js"></script>
  <script src="core/liquid-glass-appearance.js"></script>
  <script src="core/theme.js"></script>
</head>
<body>
  <!-- Shell skeleton only. Everything visible is mounted by core/composer.js
       and core plugin hosts from src/renderer/plugins/*.js registrations:
       pages/tiles via config/desktop_layout.js and status-bar via kind="status"
       plugins. Widgets state truth first and stay display-only; interactive App
       pages and #app-view own all controls. -->
  <header id="status-bar" class="flex items-center">
    <span data-slot="status-left"></span>
    <span data-slot="status-right"></span>
    <span id="status-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
  </header>

  <main id="home-desk">
    <div id="liquid-glass-backdrop" class="lg-content" aria-hidden="true" hidden></div>
    <aside id="personal-agent" aria-label="Personal Agent"></aside>
    <section id="desk-content" aria-label="Desk">
      <section id="home-summary" aria-label="Desk briefing"></section>
      <div id="pages-viewport"><div id="pages-track"></div></div>
      <div id="page-center" class="flex items-center">
        <span id="page-context" class="sr-only" aria-live="polite" aria-atomic="true"></span>
        <nav id="dots" class="flex items-center" aria-label="Page controller"></nav>
      </div>
      <div id="app-view" role="region" aria-labelledby="app-title" hidden>
          <h1 id="app-title" class="sr-only"></h1>
          <header class="app-header flex items-center">
            <button id="app-back" aria-label="Back">
              <svg data-tabler="chevron-left" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 6l-6 6l6 6" /></svg>
            </button>
          </header>
          <div class="app-body flex flex-col items-center justify-center">
            <div id="app-runtime" class="app-runtime" data-slot="app-runtime"></div>
            <p class="app-empty" id="app-empty"></p>
            <p class="app-help" id="app-help" hidden>Swipe the bottom handle sideways to change pages. Swipe it up to return from a Widget App. Focus the handle and use arrow keys for keyboard navigation.</p>
            <p class="app-empty-sub" id="app-empty-sub"></p>
            <button class="button-pill app-action" id="app-action" type="button" hidden>Check status again</button>
            <p class="app-action-status" id="app-action-status" aria-live="polite" hidden></p>
          </div>
        </div>
    </section>
  </main>

  <div id="system-overlay-root" class="system-overlay-container" aria-live="polite"></div>
  <div id="personal-agent-status" role="dialog" aria-modal="true" aria-label="Personal Agent" hidden>
    <div class="personal-agent-status-content" tabindex="0">
      <div class="personal-agent-status-input" role="group" aria-label="Spoken input" hidden>
        <svg class="personal-agent-status-input-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1 -6 0z" /><path d="M5 10v2a7 7 0 0 0 14 0v-2" /><path d="M8 21h8" /><path d="M12 19v2" /></svg>
        <div class="personal-agent-status-transcript" dir="auto"></div>
      </div>
      <div class="personal-agent-status-announcement" role="status">
        <div class="personal-agent-status-heading">
          <span class="personal-agent-status-icon" aria-hidden="true">
            <svg data-state-icon-name="microphone" viewBox="0 0 24 24"><path d="M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1 -6 0z" /><path d="M5 10v2a7 7 0 0 0 14 0v-2" /><path d="M8 21h8" /><path d="M12 19v2" /></svg>
            <svg data-state-icon-name="arrow-up" viewBox="0 0 24 24"><path d="M12 19V5" /><path d="M6 11l6 -6l6 6" /></svg>
            <svg data-state-icon-name="wave-sine" viewBox="0 0 24 24"><path d="M3 12c3 -8 6 8 9 0s6 8 9 0" /></svg>
            <svg data-state-icon-name="arrow-right" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M13 6l6 6l-6 6" /></svg>
            <svg data-state-icon-name="alert-triangle" viewBox="0 0 24 24"><path d="M12 3l9 16H3z" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg>
            <svg data-state-icon-name="microphone-off" viewBox="0 0 24 24"><path d="M9 5a3 3 0 0 1 5.7 -1.3" /><path d="M15 9v3a3 3 0 0 1 -.3 1.3" /><path d="M5 10v2a7 7 0 0 0 11.2 5.6" /><path d="M8 21h8" /><path d="M12 19v2" /><path d="M3 3l18 18" /></svg>
          </span>
          <span class="personal-agent-status-stage"></span>
        </div>
        <span class="personal-agent-status-detail"></span>
      </div>
      <div class="personal-agent-status-progress" aria-hidden="true" hidden><span></span></div>
      <div class="personal-agent-status-level" aria-hidden="true" hidden><span></span></div>
      <div class="personal-agent-status-title" dir="auto" aria-live="polite" aria-atomic="false" aria-busy="false" hidden></div>

    </div>
  </div>
    </div>
  </div>
  <script src="../../node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script>
  <!-- Pi highlights code with highlight.js, so the desk uses the same tokenizer
       and maps its scopes to Pi's own reading palette. -->
  <script src="../../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
  <script src="core/personal-agent-reply.js"></script>
  <script src="core/personal-agent-status.js"></script>


  <script src="layout.js"></script>
  <script src="core/grid-placement.js"></script>
  <script src="core/overlay-alerts.js"></script>
  <script src="core/registry.js"></script>
  <script src="core/runtime-config.js"></script>
  <script src="icons/pixelarticons.js"></script>
  <script src="core/icons.js"></script>
  <script src="core/services.js"></script>
  <script src="core/composer.js"></script>
  <script src="core/runtime-controller.js"></script>
  <script src="core/app-platform.js"></script>
  <script src="core/home-handle.js"></script>
  <script src="core/gamepad.js"></script>
  <script src="plugins/dashboard-page.js"></script>
  <script src="avatars/onee-sdk.js"></script>
  <script src="core/personal-agent-avatar.js"></script>
  <script src="plugins/personal-agent.js"></script>
  <script src="plugins/status-peripherals.js"></script>
  <script src="plugins/weread/typography.js"></script>
  <script src="plugins/weread.js"></script>
  <script src="plugins/pomodoro.js"></script>
  <script src="plugins/hydra.js"></script>
  <script src="plugins/futu.js"></script>
  <script src="plugins/year.js"></script>
  <script src="plugins/weather.js"></script>
  <script src="plugins/quota-page.js"></script>
  <script src="plugins/status-connection.js"></script>
  <script src="plugins/status-gamepad.js"></script>
  <script src="plugins/status-clock.js"></script>
  <script src="plugins/status-pi-sessions.js"></script>
  <script src="plugins/apps.js"></script>
  <script src="plugins/reading-apps.js"></script>
  <script src="plugins/pi-sessions.js"></script>
  <script src="core/user-app-frame.js"></script>
  <script src="core/user-app-desktop.js"></script>
  <script src="core/user-app-desktop-plugins.js"></script>
  <script src="config/desktop_layout.js"></script>
  <script src="core/plugin-control.js"></script>
  <script src="core/plugin-diagnostics.js"></script>
  <script src="shell.js"></script>
</body>
</html>
